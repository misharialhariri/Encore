version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: encore
      POSTGRES_PASSWORD: encore_dev_password
      POSTGRES_DB: encore
    ports:
      - "5432:5432"
    volumes:
      - encore_postgres_data:/var/lib/postgresql/data

volumes:
  encore_postgres_data:
